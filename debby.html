<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deborah Showcase</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Ajadi Deborah</h1>
    <p> A showcase of three of  her many artworks,she has done</p>
  </header>
   <div class="image-gallery">
  <img src="proj 01.png" alt="Artwork 1" ondblclick="location.href='proj 01.png'">
  <img src="pro 02.png" alt="Artwork 2" ondblclick="location.href='pro 02.png'">
  <img src="pro 03.png" alt="Artwork 3" ondblclick="location.href='pro 03.png'">
</div>





  <section class="profile">
   
    <button onclick="location.href='deborah.html'">Back</button>
  </section>
  <style>
    /* Gallery container */
.image-gallery {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 20px;
  margin: 30px auto;
  max-width: 1000px;
  justify-items: center; /* centers images in each grid cell */
}

/* Individual images */
.image-gallery img {
  width: 100%;
  max-width: 250px;   /* keeps images consistent */
  height: 250px;
  object-fit: cover;  /* crops nicely without distortion */
  border-radius: 12px;
  border: 4px solid #004080;
  box-shadow: 0 6px 12px rgba(0,0,0,0.1);
  transition: transform 0.3s;
}

.image-gallery img:hover {
  transform: scale(1.05);
}

    /* General body */
body {
  margin: 0;
  font-family: 'Segoe UI', Arial, sans-serif;
  background: #f0f2f5;
  color: #333;
  line-height: 1.6;
}
/* Gallery container */
.image-gallery {
  display: flex;
  flex-wrap: wrap;
  justify-content: center; /* centers images horizontally */
  gap: 20px; /* space between images */
  margin: 30px auto;
  max-width: 900px;
}

/* Individual images */
.image-gallery img {
  width: 250px;   /* fixed size */
  height: 250px;  /* fixed size */
  object-fit: cover; /* crops nicely without distortion */
  border-radius: 12px;
  border: 4px solid #004080;
  box-shadow: 0 6px 12px rgba(0,0,0,0.1);
  transition: transform 0.3s;
}

.image-gallery img:hover {
  transform: scale(1.05);
}


/* Header */
header {
  background: linear-gradient(135deg, #004080, #0066cc);
  color: white;
  padding: 30px;
  text-align: center;
  box-shadow: 0 4px 8px rgba(0,0,0,0.2);
}

header h1 {
  font-size: 2.5rem;
  margin-bottom: 10px;
  letter-spacing: 2px;
}

header p {
  font-size: 1.2rem;
  font-style: italic;
}

/* Profile section */
.profile {
  max-width: 700px;
  margin: 50px auto;
  text-align: center;
  background: #fff;
  padding: 30px;
  border-radius: 12px;
  box-shadow: 0 6px 12px rgba(0,0,0,0.1);
}

.profile img {
  width: 220px;
  border-radius: 50%;
  margin-bottom: 20px;
  border: 5px solid #004080;
}

.profile h2 {
  font-size: 1.8rem;
  color: #004080;
  margin-bottom: 15px;
}

.profile p {
  font-size: 1.1rem;
  margin-bottom: 20px;
}

/* Skills list */
.profile h3 {
  font-size: 1.4rem;
  margin-top: 20px;
  color: #0066cc;
}

.profile ul {
  list-style: none;
  padding: 0;
}

.profile ul li {
  background: #e6f0ff;
  margin: 8px 0;
  padding: 10px;
  border-radius: 6px;
  font-weight: bold;
  transition: background 0.3s;
}

.profile ul li:hover {
  background: #cce0ff;
}

/* Buttons */
button {
  margin-top: 20px;
  padding: 10px 18px;
  border: none;
  background: #004080;
  color: white;
  border-radius: 6px;
  cursor: pointer;
  font-size: 1rem;
  transition: background 0.3s, transform 0.2s;
}

button:hover {
  background: #0066cc;
  transform: scale(1.05);
}

/* Footer */
footer {
  background: #004080;
  color: white;
  padding: 15px;
  margin-top: 50px;
  text-align: center;
  font-size: 0.9rem;
}

  </style>

  <footer>
    &copy; 2026 ICT CLUB | All Rights Reserved
  </footer>
</body>
</html>
